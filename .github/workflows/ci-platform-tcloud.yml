name: T-Cloud Platform CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'platforms/tcloud/**'
      - 'src/core/**'
      - 'tests/tcloud/**'
      - '.github/workflows/ci-platform-tcloud.yml'
  pull_request:
    paths:
      - 'platforms/tcloud/**'
      - 'src/core/**'
      - 'tests/tcloud/**'

env:
  PLATFORM_NAME: tcloud
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mesh-metering-tcloud

jobs:
  test:
    name: Test T-Cloud Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r platforms/tcloud/requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/tcloud/ -v --cov=platforms/tcloud --cov-report=term

  build:
    name: Build Container
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./platforms/tcloud/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tcloud
          cache-to: type=gha,mode=max,scope=tcloud
          platforms: linux/amd64,linux/arm64
